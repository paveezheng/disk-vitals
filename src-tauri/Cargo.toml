[package]
name = "disk-vitals"
version = "0.1.0"
description = "macOS 硬盘健康监测工具"
edition = "2021"
rust-version = "1.77"

[lib]
name = "disk_vitals_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
cc = "1"

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
